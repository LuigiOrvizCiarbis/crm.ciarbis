# Netdata - config del agente de produccion
#
# Lo importante de este archivo esta en [plugin:cgroups]: el patron que hace
# que Netdata ignore staging y erp-woo-sync por completo.

[global]
    run as user = netdata
    # 1s de resolucion: suficiente para ver picos de RAM como el del scheduler.
    update every = 1

[db]
    # dbengine = base de series temporales propia, comprimida en disco.
    mode = dbengine
    # ~1GB de historico. Con 7 containers da varios dias a 1s de resolucion.
    # El VPS tiene 151GB libres, sobra.
    dbengine multihost disk space MB = 1024

[directories]
    # El compose monta esto read-only; Netdata escribe solo en lib y cache.
    stock config = /usr/lib/netdata/conf.d

[registry]
    # No mandar nada a Netdata Cloud. Todo queda en el VPS.
    enabled = no

[health]
    enabled = yes
    # Chequea alarmas cada 10s (no hace falta cada segundo).
    run at least every seconds = 10
    # Script que dispara los mails; lee health_alarm_notify.conf.
    script to execute on alarm = /usr/libexec/netdata/plugins.d/alarm-notify.sh

[web]
    # nginx llega por loopback. Sin acceso directo desde afuera.
    bind to = 0.0.0.0:19999
    # Aceptar el IP real que nginx reenvia, para que los logs no muestren
    # todos los accesos como 127.0.0.1.
    allow connections from = localhost *

# ---------------------------------------------------------------------------
# EXCLUSION DE STAGING  <- el corazon de esta config
# ---------------------------------------------------------------------------
[plugin:cgroups]
    # Solo se monitorean los 7 containers de PRODUCCION.
    #
    # OJO con cual de las tres directivas se usa - se probo en el VPS:
    #
    #  - "enable by default cgroups matching" filtra por el nombre CRUDO del
    #    cgroup, que para Docker es "system.slice_docker-<hash>.scope". Ahi el
    #    nombre del container no aparece, asi que un patron como !*staging*
    #    no matchea nada. Ademas su default trae exclusiones necesarias
    #    (!*.mount, !*.slice, !*.service...) y sobreescribirlo hace que Netdata
    #    intente monitorear cgroups del sistema que no son containers.
    #    => NO SE TOCA.
    #
    #  - "enable by default cgroups names matching" filtra por el nombre YA
    #    RESUELTO via docker.sock ("crm-si-back-app-1"). Es la correcta.
    #
    # Sintaxis de simple patterns: negaciones primero, '*' al final para que
    # el resto quede incluido. Se evalua en orden y gana la primera
    # coincidencia; con el '*' adelante no excluiria nada.
    #
    #   !*staging*      -> los 5 containers de staging
    #   !*erp-woo-sync* -> el sync de WooCommerce (no se usa)
    #
    # El glob cubre containers de staging que todavia no existen: si manana
    # aparece crm-si-back-staging-queue-worker-1, queda excluido solo.
    #
    # Efecto: no se grafican, no se guardan metricas y no generan alertas.
    # Si alguno pasa a produccion, hay que sacarlo de esta linea.
    enable by default cgroups names matching = !*staging* !*erp-woo-sync* !netdata* *

    # Resuelve nombres de containers via docker.sock (si no, IDs de cgroup).
    run script to rename cgroups matching = *

    # cgroup-network mapea interfaces de red por container. Desde un container
    # sin --network=host no puede entrar al netns de los otros y falla con
    # "Cannot find a cgroup PID" por cada uno, en cada scan: son ~14 errores
    # por ciclo que tapan los logs reales.
    # Se pierden solo las metricas de red POR CONTAINER; las del host siguen.
    # Verificado en el VPS: sin esto, los logs quedan limpios.
    script to get cgroup network interfaces =

# ---------------------------------------------------------------------------
# Plugins apagados: no aplican a este VPS y consumen CPU al recolectar.
# ---------------------------------------------------------------------------
[plugin:proc]
    # Sin GPUs NVIDIA.
    /sys/devices/system/node = no

[plugin:idlejitter]
    enabled = no
