# nginx - monitor.sicrmapp.com -> Netdata (127.0.0.1:19999)
#
# Instalar en el VPS:
#   sudo cp monitor.sicrmapp.com.conf /etc/nginx/sites-available/monitor.sicrmapp.com
#   sudo ln -s /etc/nginx/sites-available/monitor.sicrmapp.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requiere ANTES:
#   1. Registro DNS A: monitor.sicrmapp.com -> 72.62.12.121
#   2. htpasswd -c /etc/nginx/.htpasswd-monitor <usuario>
#
# El bloque ssl lo agrega certbot:
#   sudo certbot --nginx -d monitor.sicrmapp.com

server {
    server_name monitor.sicrmapp.com;

    # Netdata es la unica entrada al dashboard: sin auth queda publico todo
    # el estado de la infra (nombres de containers, uso de recursos, procesos).
    auth_basic           "Monitoreo";
    auth_basic_user_file /etc/nginx/.htpasswd-monitor;

    location / {
        proxy_pass http://127.0.0.1:19999;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El dashboard streamea metricas en vivo por WebSocket; sin estos
        # headers los graficos quedan congelados.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering off: las respuestas del API de Netdata son streams.
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;

        # Conexiones largas del dashboard en vivo.
        proxy_read_timeout 3600;

        # gzip: el API manda JSON grande y el VPS tiene 4 cores.
        gzip on;
        gzip_proxied any;
        gzip_types application/json text/plain application/javascript text/css;
    }

    listen 443 ssl;
    # Estas 4 lineas las gestiona certbot.
    ssl_certificate     /etc/letsencrypt/live/monitor.sicrmapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.sicrmapp.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = monitor.sicrmapp.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name monitor.sicrmapp.com;
    return 404;
}
