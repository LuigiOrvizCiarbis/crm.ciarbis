# Alertas del colector go.d/docker (estado de containers)
#
# POR QUE EXISTE ESTE ARCHIVO:
# Netdata mira los containers por DOS caminos distintos:
#
#   1. plugin de cgroups  -> CPU/RAM/disco. Se filtra en netdata.conf con
#                            "enable by default cgroups names matching".
#   2. colector go.d/docker -> estado (running/exited/unhealthy). Lee el
#                            docker.sock por su cuenta y NO respeta aquel
#                            filtro.
#
# Sin este archivo, el camino 2 alerta igual por staging y erp-woo-sync:
# verificado en el VPS, saltaron dos "docker_container_unhealthy" por
# erp-woo-sync y crm-si-back-staging-reverb-1 (que estan unhealthy hace
# semanas y no se usan). Justo el ruido que este setup quiere evitar.
#
# Aca el filtro SI va por "chart labels", porque estas alarmas etiquetan
# cada instancia con container_name.

# ---------------------------------------------------------------------------
# Container en estado unhealthy
# ---------------------------------------------------------------------------
   template: docker_container_unhealthy
         on: docker.container_health_status
      class: Errors
       type: Containers
  component: Docker
# Solo produccion: mismo criterio que netdata.conf.
# Si un container excluido pasa a prod, sacarlo tambien de esta linea.
chart labels: container_name=!*staging* !*erp-woo-sync* !netdata* *
      units: status
      every: 10s
     lookup: average -10s of unhealthy
       warn: $this > 0
      delay: up 2m down 5m
    summary: Container ${label:container_name} unhealthy
       info: El healthcheck de ${label:container_name} viene fallando. Revisar con `docker logs ${label:container_name}`.
         to: sysadmin

# ---------------------------------------------------------------------------
# Container caido
# ---------------------------------------------------------------------------
# Cubre el caso de un container que se muere y no vuelve (restart: always
# reintenta, pero si falla al arrancar queda exited).
   template: docker_container_down
         on: docker.container_state
      class: Errors
       type: Containers
  component: Docker
chart labels: container_name=!*staging* !*erp-woo-sync* !netdata* *
      units: status
      every: 10s
     lookup: average -10s of exited
       warn: $this > 0
      delay: up 2m down 5m
    summary: Container ${label:container_name} caido
       info: El container ${label:container_name} esta exited. Revisar con `docker ps -a` y `docker logs ${label:container_name}`.
         to: sysadmin
