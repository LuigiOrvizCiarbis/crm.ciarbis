# Alertas del HOST (VPS srv1191218: 4 cores, 15GB RAM, 193GB disco)
#
# Redefine alarmas stock con umbrales ajustados a este VPS.

# ---------------------------------------------------------------------------
# Disco
# ---------------------------------------------------------------------------
# Stock avisa a 80/90. Aca 75/85 porque el disco crece solo: el build cache
# de Docker ya son 16GB (12.7 reclamables) y suma en cada deploy a preprod.
# Avisar antes da tiempo a correr `docker builder prune` sin apuro.
#
# Hoy: 43G/193G = 23%.
    template: disk_space_usage
          on: disk.space
       class: Utilization
        type: System
   component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* !HarddiskVolume* *
        calc: $used * 100 / ($avail + $used)
       units: %
       every: 1m
        warn: $this > (($status >= $WARNING ) ? (75) : (85))
        crit: ($this > (($status == $CRITICAL) ? (85) : (95))) && $avail < 10
       delay: up 1m down 15m multiplier 1.5 max 1h
     summary: Disco ${label:mount_point} al ${this}%
        info: Disco ${label:mount_point} llenandose. Revisar el build cache de Docker - `docker system df` y `docker builder prune`.
          to: sysadmin

# ---------------------------------------------------------------------------
# CPU del host
# ---------------------------------------------------------------------------
# 4 cores compartidos entre los 7 de prod y los 6 ignorados (que igual
# consumen CPU real aunque Netdata no los grafique).
    template: 10min_cpu_usage
          on: system.cpu
       class: Utilization
        type: System
   component: CPU
host labels: _os=linux
      lookup: average -10m unaligned match-names of user,system,softirq,irq,guest
       units: %
       every: 1m
        warn: $this > (($status >= $WARNING)  ? (75) : (85))
        crit: $this > (($status == $CRITICAL) ? (85) : (95))
       delay: up 5m down 15m multiplier 1.5 max 1h
     summary: CPU del host al ${this}%
        info: El VPS lleva 10 minutos con la CPU alta (4 cores compartidos entre prod y staging).
          to: sysadmin

# ---------------------------------------------------------------------------
# OOM kill
# ---------------------------------------------------------------------------
# El escenario que mas importa acá: el scheduler vive al 95.64% de sus 128M.
# Si el kernel lo mata, el container sigue "up" pero las tareas programadas
# dejan de correr. Sin esta alerta uno se entera dias despues.
       alarm: oom_kill
          on: mem.oom_kill
      lookup: sum -5m unaligned
       units: procesos
       every: 10s
        warn: $this > 0
       delay: down 5m
     summary: El kernel mato ${this} proceso(s) por falta de memoria
        info: Hubo OOM kills en los ultimos 5 minutos. Revisar que container fue con `dmesg -T | grep -i oom` y si su limite de RAM quedo corto.
          to: sysadmin
