# Alertas de containers de PRODUCCION
#
# Redefine las alarmas stock de cgroups. Las de fabrica vienen con "to: silent"
# (existen pero no notifican a nadie), asi que sin este archivo no llegaria
# ningun mail aunque el SMTP funcione.
#
# NO llevan filtro de containers: la exclusion de staging se hace antes, en
# netdata.conf [plugin:cgroups]. Lo que Netdata ve ya es solo produccion.

# ---------------------------------------------------------------------------
# RAM por container  <- la alerta central de este setup
# ---------------------------------------------------------------------------
# Umbrales 80/90 (warn/crit).
#
# Historia, porque importa para no re-tocar esto a ciegas: la primera lectura
# mostro al scheduler al 95.64% de sus 128M y se penso subir los umbrales a
# 85/95 para que no gritara. Midiendo 20min con Netdata dio 12.5-13 MiB
# estables = ~10% del limite: aquel 95% fue un pico puntual del deploy
# (el container tenia 54min de vida), no su estado normal.
#
# Con el uso real tan bajo, 80/90 avisa con tiempo de reaccion y no genera
# ruido. Si algun container empieza a vivir cerca del limite, la respuesta
# correcta es subirle el limite en su compose, no subir estos numeros.
   template: cgroup_ram_in_use
         on: cgroup.mem_usage
      class: Utilization
       type: Cgroups
  component: Memory
host labels: _os=linux
       calc: ($ram) * 100 / $memory_limit
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (75) : (80))
       crit: $this > (($status == $CRITICAL) ? (85) : (90))
      # 5m antes de avisar: un pico de 10s no dispara mail.
      delay: up 5m down 15m multiplier 1.5 max 1h
    summary: Container ${label:cgroup_name} usando ${this}% de su RAM
       info: El container ${label:cgroup_name} esta cerca de su limite de memoria. Si lo supera, Docker lo mata (OOM) sin aviso.
         to: sysadmin

# ---------------------------------------------------------------------------
# CPU por container
# ---------------------------------------------------------------------------
   template: cgroup_10min_cpu_usage
         on: cgroup.cpu_limit
      class: Utilization
       type: Cgroups
  component: CPU
host labels: _os=linux
     lookup: average -10m unaligned
      units: %
      every: 1m
       warn: $this > (($status == $CRITICAL) ? (85) : (95))
      delay: up 5m down 15m multiplier 1.5 max 1h
    summary: Container ${label:cgroup_name} al ${this}% de CPU
       info: El container ${label:cgroup_name} lleva 10 minutos consumiendo su cuota de CPU.
         to: sysadmin
