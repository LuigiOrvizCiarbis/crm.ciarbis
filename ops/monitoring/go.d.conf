# go.d - modulos habilitados
#
# POR QUE EXISTE ESTE ARCHIVO:
# El default de la imagen trae "docker: yes" COMENTADO, asi que el colector
# que produce docker.container_health_status / docker.container_state no
# arranca. Sin el, las alertas de "container unhealthy" y "container caido"
# de health.d/docker.conf no tienen sobre que dispararse: quedan definidas
# pero nunca se evaluan. Verificado en el VPS (charts docker_local = 0).
#
# Aca se habilita explicitamente, y de paso se apagan los colectores de
# servicios que no aplican (ver abajo).

modules:
  # Estado de containers: running / exited / unhealthy.
  docker: yes

  # ---------------------------------------------------------------------
  # Apagados a proposito
  # ---------------------------------------------------------------------
  # El service discovery de docker detecta Postgres y Redis (incluidos los
  # de staging) e intenta conectarse a cada uno. Netdata no tiene las
  # credenciales ni acceso a esas redes, asi que falla por timeout en cada
  # ciclo y llena el log:
  #   "check failed: ... dial error: timeout" job=docker_crm-si-back-db-1
  #
  # Ese discovery es un tercer camino que NO respeta el filtro de staging
  # (ver README: los otros dos son cgroups y el colector docker).
  #
  # Monitorear Postgres/Redis por dentro requiere crear usuarios de solo
  # lectura en cada uno y pasar credenciales: queda fuera del alcance de
  # este setup, que mira containers y host.
  postgres: no
  redis: no
