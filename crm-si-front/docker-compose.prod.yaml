services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID}
        NEXT_PUBLIC_FACEBOOK_CONFIGURATION_ID: ${NEXT_PUBLIC_FACEBOOK_CONFIGURATION_ID}
        NEXT_PUBLIC_FACEBOOK_GRAPH_API_VERSION: ${NEXT_PUBLIC_FACEBOOK_GRAPH_API_VERSION:-v24.0}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-https}
        NEXT_PUBLIC_SALES_WHATSAPP: ${NEXT_PUBLIC_SALES_WHATSAPP:-}
        NEXT_PUBLIC_META_CONVERSIONS_API_ENABLED: ${NEXT_PUBLIC_META_CONVERSIONS_API_ENABLED:-false}
      secrets:
        - sentry_auth_token
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
