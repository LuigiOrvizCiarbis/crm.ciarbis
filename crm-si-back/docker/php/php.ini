; Config de PHP para todos los SAPIs, incluida la CLI.
;
; Apache define sus propios php_value en docker/apache/common.conf, pero esos
; sólo aplican al SAPI web: la CLI se queda con el default de 128M. Eso alcanza
; para artisan del día a día, pero `artisan test` corre la suite completa en
; procesos hijos y muere con "Allowed memory size exhausted" antes de terminar
; (el fatal suele caer en el cliente HTTP de Sentry o al cargar routes/api.php).
memory_limit = 2G

; Alineado con los valores de Apache para que subir un archivo por CLI o por
; queue worker se comporte igual que por HTTP.
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
