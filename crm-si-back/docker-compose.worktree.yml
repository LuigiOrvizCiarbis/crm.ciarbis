# Override para correr este worktree (profile) sin chocar con otros stacks:
# checkout principal (8000/8080/5432/6379), crm-grupos (8100/8143/8180/5433/6380),
# crm-desconexion-canal (5434/6381). !override reemplaza la lista de puertos en
# vez de fusionarla (merge por defecto de Compose).
# Uso:
#   docker compose -p crm-profile -f docker-compose.yml -f docker-compose.worktree.yml up -d
services:
  app:
    ports: !override
      - "8300:80"
      - "8343:443"
    environment:
      # env_file define APP_KEY vacío en este worktree; una variable de
      # entorno del proceso siempre gana sobre .env/.env.testing, así que
      # sin esto ninguna key generada por artisan tiene efecto.
      APP_KEY: ${APP_KEY}
  reverb:
    ports: !override
      - "8380:8080"
    environment:
      APP_KEY: ${APP_KEY}
  db:
    ports: !override
      - "127.0.0.1:5435:5432"
  redis:
    ports: !override
      - "127.0.0.1:6382:6379"
