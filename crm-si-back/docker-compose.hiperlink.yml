services:
  app:
    ports: !override
      - "8500:80"
      - "8543:443"
    environment:
      APP_KEY: ${APP_KEY}
    volumes: !override
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - /Users/lucasbugiolachi/si-crm/crm-si-front/certificates:/etc/ssl/certs/local
  reverb:
    ports: !override
      - "8580:8080"
    environment:
      APP_KEY: ${APP_KEY}
  db:
    ports: !override
      - "127.0.0.1:5436:5432"
  redis:
    ports: !override
      - "127.0.0.1:6383:6379"
